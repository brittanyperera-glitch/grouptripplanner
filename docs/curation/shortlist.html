<title>Trip Picker Shortlist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
/* Layout: one column of activity rows grouped by area, a sticky tally bar on top. */
:root{--bg:#EEF0F2;--surface:#FFFFFF;--ink:#101418;--muted:#5D6670;--line:#D9DEE3;--coconut:#FF7A1A;--tea:#0B5D3B;--cut:#C2362B;--font:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B0E11;--surface:#161A1F;--ink:#EEF1F4;--muted:#98A2AD;--line:#2A3138;--coconut:#FF8A33;--tea:#3DBE86;--cut:#F0675B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0E11;--surface:#161A1F;--ink:#EEF1F4;--muted:#98A2AD;--line:#2A3138;--coconut:#FF8A33;--tea:#3DBE86;--cut:#F0675B;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{margin:0;font-size:clamp(28px,5vw,40px);font-weight:850;font-stretch:120%;line-height:1.05}
.lede{margin:6px 0 0;color:var(--muted);max-width:56ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);padding:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.bar b{font-variant-numeric:tabular-nums}
.bar .sp{flex:1}
button{font:inherit;color:inherit}
.copy{all:unset;cursor:pointer;padding:10px 14px;border-radius:12px;background:var(--ink);color:var(--surface);font-weight:700}
.copy:focus-visible,.tg:focus-visible{outline:2px solid var(--coconut);outline-offset:2px}
.copied{color:var(--tea);font-weight:600}
h2{margin:14px 0 0;font-size:20px;font-weight:800;font-stretch:112%}
.row{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row.cut{opacity:.5}
.ph{background:var(--line) center/cover no-repeat;min-height:120px}
.noph{display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:8px}
.info{padding:12px 14px 12px 0;display:flex;flex-direction:column;gap:5px;min-width:0}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.nm{font-weight:800;font-size:16px;line-height:1.2}
.facts,.cred{color:var(--muted);font-size:13px}
.cred{font-size:11px}
.warn b{color:var(--cut)}
.g a{color:var(--ink)}
.tg{all:unset;cursor:pointer;flex:none;padding:6px 12px;border-radius:99px;font-weight:700;font-size:13px;box-shadow:inset 0 0 0 1.5px var(--line)}
.tg[aria-pressed="false"]{color:var(--tea);box-shadow:inset 0 0 0 1.5px var(--tea)}
.tg[aria-pressed="true"]{color:var(--cut);box-shadow:inset 0 0 0 1.5px var(--cut)}
@media (max-width:520px){.row{grid-template-columns:1fr}.ph{min-height:170px}.info{padding:0 14px 14px}}
</style>
<div class="wrap">
  <header>
    <h1>The shortlist</h1>
    <p class="lede">All 37 activities the friends will rate. Tap Cut on anything that shouldn't make it, then copy your list and paste it to Claude. Your taps are remembered on this device.</p>
  </header>
  <div class="bar"><span><b id="kept">37</b> kept, <b id="cutn">0</b> cut</span><span class="sp"></span><span id="msg" class="copied" aria-live="polite"></span><button class="copy" id="copy">Copy my list</button></div>
  <div id="list"></div>
  <textarea id="fallback" hidden aria-label="Your list" style="width:100%;min-height:90px"></textarea>
</div>
<script>
const ITEMS=[{"id":"pettah","name":"Pettah market and Red Mosque","area":"Colombo","about":"Colombo's packed old bazaar district, plus the red and white striped Jami Ul-Alfar mosque.","hours":3,"side":0,"when":"morning","fee":"free, spend what you like","warn":"Closed Sundays and full moon days","book":"","photo":"pettah","credit":"Adam Jones from Kelowna, BC, Canada, CC BY-SA 2.0","g":{"rating":"4.0","reviews":"4,647","url":"https://www.google.com/maps/search/Pettah%20Market,%20Colombo,%20Sri%20Lanka"}},{"id":"foodtour","name":"Tuk-tuk street food tour","area":"Colombo","about":"Evening tuk-tuk loop through Colombo's street stalls: kottu, hoppers, isso wade and short eats.","hours":3,"side":0,"when":"evening","fee":"about USD 31-41 pp","warn":"","book":"a day ahead","photo":"foodtour","credit":"Pierre André Leclercq, CC BY-SA 2.0","g":null},{"id":"galleface","name":"Galle Face Green at sunset","area":"Colombo","about":"Colombo's seafront promenade for sunsets, kites and street-food carts.","hours":1.5,"side":0,"when":"sunset","fee":"free, isso wade from the stalls","warn":"","book":"","photo":"galleface","credit":"Mayooresan, CC BY-SA 3.0","g":{"rating":"4.5","reviews":"17,370","url":"https://www.google.com/maps/search/Galle%20Face%20Green,%20Colombo,%20Sri%20Lanka"}},{"id":"crab","name":"Ministry of Crab dinner","area":"Colombo","about":"Crab restaurant in the old Dutch Hospital, famous for pepper and chilli crab.","hours":2,"side":0,"when":"evening","fee":"about LKR 7,500+ pp","warn":"","book":"2-3 weeks ahead in December","photo":"crab","credit":"Masha999, CC BY-SA 4.0","g":{"rating":"4.4","reviews":"5,702","url":"https://www.google.com/maps/search/Ministry%20of%20Crab,%20Colombo,%20Sri%20Lanka"}},{"id":"gangaramaya","name":"Gangaramaya Temple","area":"Colombo","about":"Lakeside temple complex crammed with statues, relics and odd curios.","hours":1,"side":0,"when":"any","fee":"unverified","warn":"","book":"","photo":"gangaramaya","credit":"Pierre André Leclercq, CC BY-SA 4.0","g":{"rating":"4.6","reviews":"14,055","url":"https://www.google.com/maps/search/Gangaramaya%20Temple,%20Colombo,%20Sri%20Lanka"}},{"id":"bawa","name":"Geoffrey Bawa's Number 11","area":"Colombo","about":"Architect Geoffrey Bawa's own townhouse, seen on a guided tour.","hours":1,"side":0,"when":"fixed tour times","fee":"LKR 5,000","warn":"","book":"guided tours only, weekdays 10:00, 14:00, 15:30","photo":"bawa","credit":"Andrés Moreno, CC BY-SA 2.0","g":{"rating":"4.6","reviews":"585","url":"https://www.google.com/maps/search/Number%2011%20Geoffrey%20Bawa,%20Colombo,%20Sri%20Lanka"}},{"id":"rooftop","name":"Rooftop drinks or Lotus Tower","area":"Colombo","about":"Landmark tower with a city and ocean viewing deck, or a rooftop bar instead.","hours":2,"side":0,"when":"evening","fee":"Lotus Tower USD 20","warn":"","book":"","photo":"rooftop","credit":"Mohamed Rilwan1210, CC BY-SA 4.0","g":{"rating":"4.5","reviews":"12,589","url":"https://www.google.com/maps/search/Lotus%20Tower%20Colombo,%20Sri%20Lanka"}},{"id":"lavinia","name":"Mount Lavinia beach","area":"Colombo","about":"Beach just south of Colombo with seafront restaurants, best at sunset.","hours":2,"side":1.36,"when":"afternoon","fee":"free","warn":"Rips and undertow, not one for swimming","book":"","photo":"lavinia","credit":"Alexey Komarov, CC BY 3.0","g":{"rating":"4.5","reviews":"4,514","url":"https://www.google.com/maps/search/Mount%20Lavinia%20Beach,%20Sri%20Lanka"}},{"id":"kottu","name":"Late-night kottu at Pilawoos","area":"Colombo","about":"Late-night kottu roti from a Colombo institution open round the clock.","hours":1,"side":0,"when":"late night","fee":"cheap","warn":"Rated 3.4 on Google; it's about the 3am kottu, not the service","book":"","photo":"kottu","credit":"Dankesie, CC BY-SA 4.0","g":{"rating":"3.4","reviews":"1,170","url":"https://www.google.com/maps/search/Pilawoos%20Hotel%20restaurant%20Colombo"}},{"id":"sigiriya","name":"Sigiriya Rock","area":"Cultural Triangle","about":"5th-century rock fortress with palace ruins on top and frescoes on the way up.","hours":3,"side":0,"when":"gate opening","fee":"USD 35","warn":"","book":"online, recommended","photo":"sigiriya","credit":"Dronepicr, CC BY 3.0","g":{"rating":"4.7","reviews":"24,355","url":"https://www.google.com/maps/search/Sigiriya%20Rock%20Fortress,%20Sri%20Lanka"}},{"id":"pidurangala","name":"Pidurangala sunrise","area":"Cultural Triangle","about":"Rock next door to Sigiriya, short scramble to the best view of it.","hours":2,"side":0.3,"when":"sunrise","fee":"LKR 1,000","warn":"Last bit is a scramble, bring a head torch","book":"","photo":"pidurangala","credit":"Nipuna Gamage, CC BY-SA 4.0","g":{"rating":"4.8","reviews":"11,464","url":"https://www.google.com/maps/search/Pidurangala%20Rock%20Temple,%20Sri%20Lanka"}},{"id":"dambulla","name":"Dambulla cave temple","area":"Cultural Triangle","about":"UNESCO cave temples packed with painted ceilings and Buddha statues.","hours":1.5,"side":1.14,"when":"morning","fee":"LKR 3,000","warn":"Cover shoulders and knees","book":"","photo":"dambulla","credit":"Philip Nalangan, CC BY 4.0","g":{"rating":"4.5","reviews":"17,020","url":"https://www.google.com/maps/search/Dambulla%20Cave%20Temple,%20Sri%20Lanka"}},{"id":"polonnaruwa","name":"Polonnaruwa by bike","area":"Cultural Triangle","about":"Medieval royal capital, ruins spread out enough to do by bike.","hours":4,"side":2.7,"when":"morning","fee":"USD 30","warn":"","book":"","photo":"polonnaruwa","credit":"Philip Nalangan, CC BY 4.0","g":{"rating":"4.5","reviews":"1,424","url":"https://www.google.com/maps/search/Polonnaruwa%20Ancient%20City,%20Sri%20Lanka"}},{"id":"elephants","name":"Elephant safari","area":"Cultural Triangle","about":"Jeep safari to watch wild herds gather around the reservoirs.","hours":3,"side":1.54,"when":"afternoon","fee":"about USD 35 pp plus jeep","warn":"December herds are at Kaudulla or Hurulu, not Minneriya; the driver picks on the day","book":"","photo":"elephants","credit":"David Stanley from Nanaimo, Canada, CC BY 2.0","g":{"rating":"4.6","reviews":"227","url":"https://www.google.com/maps/search/Kaudulla%20National%20Park,%20Sri%20Lanka"}},{"id":"anuradhapura","name":"Anuradhapura sacred city","area":"Cultural Triangle","about":"The first ancient capital: giant stupas and the sacred bo tree.","hours":6,"side":3.06,"when":"morning","fee":"USD 30","warn":"Full day plus 1.5 h each way from Sigiriya","book":"","photo":"anuradhapura","credit":"Z thomas, CC BY-SA 4.0","g":{"rating":"4.9","reviews":"15,071","url":"https://www.google.com/maps/search/Anuradhapura%20sacred%20city,%20Sri%20Lanka"}},{"id":"village","name":"Village tour and cooking lunch","area":"Cultural Triangle","about":"Village visit by cart and canoe, then a home-cooked rice and curry lunch.","hours":3,"side":0,"when":"any","fee":"about USD 15-30","warn":"","book":"","photo":"village","credit":"me, CC BY-SA 4.0","g":null},{"id":"tooth","name":"Temple of the Tooth, evening puja","area":"Kandy and Knuckles","about":"Kandy's royal temple housing the Buddha's Tooth Relic; the evening ceremony has drums.","hours":1.5,"side":0,"when":"18:30","fee":"LKR 3,000","warn":"No shorts or bare shoulders","book":"","photo":"tooth","credit":"A.Savin, FAL","g":{"rating":"4.7","reviews":"33,680","url":"https://www.google.com/maps/search/Temple%20of%20the%20Sacred%20Tooth%20Relic,%20Kandy,%20Sri%20Lanka"}},{"id":"knuckles","name":"Knuckles day hike","area":"Kandy and Knuckles","about":"Guided hike in the misty Knuckles range to the Mini World's End drop.","hours":6,"side":5.06,"when":"morning","fee":"about LKR 650 permit plus guide","warn":"Some trails damaged by the 2025 cyclone, check which are open","book":"","photo":"knuckles","credit":"Nethupa Lekamge, CC BY-SA 4.0","g":{"rating":"4.8","reviews":"826","url":"https://www.google.com/maps/search/Mini%20World%27s%20End,%20Riverston,%20Sri%20Lanka"}},{"id":"rafting","name":"Kitulgala white water rafting","area":"Kitulgala","about":"Grade 2-3 rapids on the Kelani river, with jungle on both banks.","hours":3,"side":0,"when":"morning","fee":"about USD 25-40","warn":"","book":"through an operator","photo":"rafting","credit":"Pol van den Scheetek…, CC BY 3.0","g":{"rating":"4.9","reviews":"293","url":"https://www.google.com/maps/search/Kitulgala%20white%20water%20rafting,%20Sri%20Lanka"}},{"id":"train","name":"Nanu Oya to Ella train","area":"Hill country","about":"The best-scenery stretch of the hill country railway, tea fields all the way.","hours":2.5,"side":0.2,"when":"09:00 or 14:30","fee":"about LKR 4,000 reserved","warn":"The Kandy section is shut until at least early 2027, so we drive to Nanu Oya","book":"seats open 30 days ahead","photo":"train","credit":"Angshuman Chatterjee, CC BY-SA 3.0","g":null},{"id":"horton","name":"Horton Plains and World's End","area":"Hill country","about":"Cloud-forest plateau walk to the World's End cliff edge.","hours":4,"side":2.4,"when":"sunrise","fee":"about USD 40 all-in","warn":"Mist rolls in by mid-morning, cold at dawn","book":"","photo":"horton","credit":"Pamuditha2000, CC BY-SA 4.0","g":{"rating":"4.6","reviews":"10,690","url":"https://www.google.com/maps/search/Horton%20Plains%20National%20Park,%20Sri%20Lanka"}},{"id":"tea","name":"Tea factory tour","area":"Hill country","about":"Tour of a working tea factory, ending with a tasting.","hours":1.5,"side":0,"when":"daytime","fee":"small","warn":"The Pedro factory rates only 3.6 on Google and its old estate listing is closed; we'd pick a better-rated estate","book":"","photo":"tea","credit":"Bergentroll, CC0","g":{"rating":"3.6","reviews":"584","url":"https://www.google.com/maps/search/Pedro%20Tea%20Estate,%20Nuwara%20Eliya,%20Sri%20Lanka"}},{"id":"ellarock","name":"Ella Rock hike","area":"Ella","about":"Longer hike to a big valley view, partly along the railway line.","hours":4.5,"side":0,"when":"06:00 start","fee":"free","warn":"Slippery when wet, leeches in December","book":"","photo":"ellarock","credit":"Gayan Perera, CC BY-SA 4.0","g":{"rating":"4.5","reviews":"2,078","url":"https://www.google.com/maps/search/Ella%20Rock,%20Sri%20Lanka"}},{"id":"littleadams","name":"Little Adam's Peak","area":"Ella","about":"Easy summit walk above Ella's tea fields, great at sunrise.","hours":2,"side":0,"when":"sunrise","fee":"free","warn":"","book":"","photo":"littleadams","credit":"Bcd4e6, CC BY-SA 4.0","g":{"rating":"4.7","reviews":"1,282","url":"https://www.google.com/maps/search/Little%20Adam%27s%20Peak,%20Ella,%20Sri%20Lanka"}},{"id":"ninearch","name":"Nine Arch Bridge","area":"Ella","about":"Colonial stone railway viaduct in the jungle; time it for a train.","hours":1,"side":0,"when":"train times","fee":"free","warn":"Never on the track when a train is due","book":"","photo":"ninearch","credit":"A.Savin, FAL","g":{"rating":"4.6","reviews":"461","url":"https://www.google.com/maps/search/Nine%20Arch%20Bridge,%20Ella,%20Sri%20Lanka"}},{"id":"zipline","name":"Flying Ravana zipline","area":"Ella","about":"Ella's zipline park, half a kilometre over the jungle valley.","hours":1,"side":0,"when":"daytime","fee":"about USD 32-40","warn":"","book":"a day ahead","photo":"","credit":"","g":{"rating":"4.7","reviews":"4,438","url":"https://www.google.com/maps/search/Flying%20Ravana%20zipline,%20Ella,%20Sri%20Lanka"}},{"id":"diyaluma","name":"Diyaluma Falls upper pools","area":"Ella","about":"Sri Lanka's second-highest waterfall, with natural pools at the top.","hours":5,"side":2.5,"when":"late morning","fee":"guide about LKR 625","warn":"High December flow, slippery rock; there has been a fatal fall","book":"","photo":"diyaluma","credit":"SarangaRodrigo, CC BY-SA 4.0","g":{"rating":"4.8","reviews":"4,942","url":"https://www.google.com/maps/search/Diyaluma%20Falls,%20Sri%20Lanka"}},{"id":"lipton","name":"Lipton's Seat","area":"Ella","about":"Hilltop lookout where Thomas Lipton surveyed his tea estates.","hours":3,"side":2.5,"when":"sunrise","fee":"small","warn":"","book":"","photo":"lipton","credit":"Vyacheslav Argenberg, CC BY 4.0","g":{"rating":"4.6","reviews":"5,674","url":"https://www.google.com/maps/search/Lipton%27s%20Seat,%20Haputale,%20Sri%20Lanka"}},{"id":"yala","name":"Yala leopard safari","area":"Wild south","about":"Leopard and elephant safari in Sri Lanka's most famous park.","hours":4.5,"side":1.24,"when":"gate opening","fee":"about USD 45 pp plus jeep","warn":"Very busy with jeeps; sightings not guaranteed","book":"","photo":"leopard","credit":"Asirilak, CC BY-SA 4.0","g":{"rating":"4.2","reviews":"6,308","url":"https://www.google.com/maps/search/Yala%20National%20Park,%20Sri%20Lanka"}},{"id":"udawalawe","name":"Udawalawe elephants and Transit Home","area":"Wild south","about":"Reliable wild elephant sightings, plus the orphan calves' feeding at the Transit Home.","hours":4,"side":0,"when":"morning","fee":"about USD 27 pp plus jeep","warn":"","book":"","photo":"udawalawe","credit":"Z thomas, CC BY-SA 4.0","g":{"rating":"4.5","reviews":"7,120","url":"https://www.google.com/maps/search/Udawalawe%20National%20Park,%20Sri%20Lanka"}},{"id":"surf","name":"Weligama surf lesson","area":"South coast","about":"Gentle beginner surf bay with lots of schools.","hours":1.5,"side":0,"when":"morning","fee":"about USD 20-35","warn":"Stay mid-bay, rips near the headlands","book":"","photo":"surf","credit":"Annelicious i, CC BY-SA 4.0","g":{"rating":"4.4","reviews":"1,068","url":"https://www.google.com/maps/search/Weligama%20Beach,%20Sri%20Lanka"}},{"id":"whales","name":"Whale watching, responsible operator","area":"South coast","about":"Morning boat trip to see blue whales offshore.","hours":5,"side":0.56,"when":"06:30","fee":"about USD 40-60","warn":"Most Mirissa boats run illegal swims; we use one with a good record. Seasickness common","book":"1-2 days ahead","photo":"whales","credit":"Peter van der Sluijs, CC BY-SA 3.0","g":{"rating":"4.6","reviews":"953","url":"https://www.google.com/maps/search/Raja%20and%20the%20Whales,%20Mirissa,%20Sri%20Lanka"}},{"id":"galle","name":"Galle Fort and sunset","area":"South coast","about":"Walled colonial town with cafes, ramparts and a lighthouse.","hours":3,"side":1.54,"when":"sunset","fee":"free","warn":"","book":"","photo":"galle","credit":"Jan Kranendonk (https://www.jankranendonk.nl), CC BY-SA 4.0","g":{"rating":"4.7","reviews":"22,584","url":"https://www.google.com/maps/search/Galle%20Fort,%20Sri%20Lanka"}},{"id":"coconut","name":"Coconut Tree Hill","area":"South coast","about":"Palm-topped headland in Mirissa, a classic sunset spot.","hours":1,"side":0,"when":"sunset","fee":"free","warn":"","book":"","photo":"coconut","credit":"Swanthika, CC BY-SA 4.0","g":{"rating":"4.4","reviews":"10,473","url":"https://www.google.com/maps/search/Coconut%20Tree%20Hill,%20Mirissa,%20Sri%20Lanka"}},{"id":"hiriketiya","name":"Hiriketiya beach and surf","area":"South coast","about":"Horseshoe surf bay near Dickwella with beach bars.","hours":6,"side":2.14,"when":"any","fee":"free","warn":"","book":"","photo":"","credit":"","g":{"rating":"4.6","reviews":"2,848","url":"https://www.google.com/maps/search/Hiriketiya%20Beach,%20Dickwella,%20Sri%20Lanka"}},{"id":"junglebeach","name":"Jungle Beach snorkel","area":"South coast","about":"Small cove reached by a short walk over Rumassala hill.","hours":3,"side":1.46,"when":"morning","fee":"snorkel hire","warn":"","book":"","photo":"junglebeach","credit":"Hirushini Dematagoda, CC BY-SA 4.0","g":{"rating":"4.2","reviews":"2,971","url":"https://www.google.com/maps/search/Jungle%20Beach,%20Unawatuna,%20Sri%20Lanka"}},{"id":"beachday","name":"Proper beach day","area":"South coast","about":"A whole day off: beach, swim, nap, repeat.","hours":6,"side":0,"when":"any","fee":"free","warn":"","book":"","photo":"beachday","credit":"Praveenshashika, CC BY-SA 4.0","g":null}];
const AREAS=["Colombo","Cultural Triangle","Kandy and Knuckles","Kitulgala","Hill country","Ella","Wild south","South coast"];
let cut=new Set();try{cut=new Set(JSON.parse(localStorage.getItem('shortlist-cut')||'[]'))}catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const h=n=>{const t=Math.round(n*2)/2;return t>=1?t+' h':Math.round(n*60)+' min'};
function render(){
  document.getElementById('list').innerHTML=AREAS.map(a=>{const its=ITEMS.filter(i=>i.area===a);if(!its.length)return'';
    return '<h2>'+esc(a)+'</h2>'+its.map(i=>{const c=cut.has(i.id);
      const ph=i.photo?'<div class="ph" style="background-image:url(img/'+i.photo+'.jpg)" role="img" aria-label="'+esc(i.name)+'"></div>':'<div class="ph noph">Photo needed</div>';
      return '<div class="row'+(c?' cut':'')+'" style="margin-top:10px">'+ph+'<div class="info"><div class="top"><span class="nm">'+esc(i.name)+'</span><button class="tg" data-id="'+i.id+'" aria-pressed="'+c+'">'+(c?'Cut':'Keep')+'</button></div>'
        +'<div>'+esc(i.about)+'</div>'
        +'<div class="facts">'+esc(i.when)+' · '+h(i.hours)+(i.side?' plus '+h(i.side)+' getting there and back':'')+' · '+esc(i.fee)+'</div>'
        +(i.warn?'<div class="warn"><b>Heads up:</b> '+esc(i.warn)+'</div>':'')
        +(i.book?'<div class="facts">Book: '+esc(i.book)+'</div>':'')
        +(i.g?'<div class="g">★ '+esc(i.g.rating)+' on Google ('+esc(i.g.reviews)+') · <a href="'+esc(i.g.url)+'" target="_blank" rel="noopener">open listing</a></div>':'')
        +(i.credit?'<div class="cred">Photo: '+esc(i.credit)+'</div>':'')
        +'</div></div>'}).join('')}).join('');
  document.getElementById('kept').textContent=ITEMS.length-cut.size;document.getElementById('cutn').textContent=cut.size;
}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.id){cut.has(b.dataset.id)?cut.delete(b.dataset.id):cut.add(b.dataset.id);try{localStorage.setItem('shortlist-cut',JSON.stringify([...cut]))}catch(e){}render();return}
  if(b.id==='copy'){const names=ITEMS.filter(i=>cut.has(i.id)).map(i=>i.name);const text=names.length?'Cut these: '+names.join('; '):'Keep all 37.';
    const msg=document.getElementById('msg');try{await navigator.clipboard.writeText(text);msg.textContent='Copied'}catch(err){const f=document.getElementById('fallback');f.hidden=false;f.value=text;f.select();msg.textContent='Select and copy the text below'}}
});
render();
</script>
