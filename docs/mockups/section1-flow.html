<title>Sri Lanka Trip Picker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
/* Layout: the phone is the page. A dot pager under it jumps between screens. */
:root{
  --bg:#EEF0F2; --surface:#FFFFFF; --ink:#101418; --muted:#5D6670; --line:#D9DEE3;
  --coconut:#FF7A1A; --tea:#0B5D3B; --meh:#9AA0A6; --skip:#C2362B; --sea:#D7E6EE; --land:#E6ECE2;
  --wide:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0E11; --surface:#161A1F; --ink:#EEF1F4; --muted:#98A2AD; --line:#2A3138;
  --coconut:#FF8A33; --tea:#3DBE86; --meh:#7E868F; --skip:#F0675B; --sea:#13222B; --land:#1F2A24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0E11; --surface:#161A1F; --ink:#EEF1F4; --muted:#98A2AD; --line:#2A3138;
  --coconut:#FF8A33; --tea:#3DBE86; --meh:#7E868F; --skip:#F0675B; --sea:#13222B; --land:#1F2A24; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--wide);font-stretch:100%;font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 56px}
button{font:inherit;color:inherit}
.wrap{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:18px;align-items:center}
.pager{display:flex;flex-wrap:wrap;justify-content:center;gap:5px}
.pg{all:unset;cursor:pointer;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
.pg[aria-current="true"]{background:var(--ink);color:var(--surface);box-shadow:none}
.pg:focus-visible{outline:2px solid var(--coconut);outline-offset:2px}
.cap{margin:0;text-align:center;color:var(--muted);font-size:13.5px;max-width:40ch}
.cap b{color:var(--ink)}
/* phone */
.phone{width:100%;max-width:380px;margin:0 auto;background:#000;border-radius:44px;padding:10px}
.screen{height:700px;border-radius:35px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 8px;font-size:13px;color:var(--muted)}
.top b{color:var(--ink)}
.body{flex:1;overflow-y:auto;padding:4px 20px 20px;display:flex;flex-direction:column;gap:14px}
.body.flush{padding:0}
.foot{padding:12px 20px 18px;display:flex;gap:8px}
.cta{all:unset;cursor:pointer;flex:1;text-align:center;padding:14px;border-radius:14px;background:var(--ink);color:var(--surface);font-weight:700}
.cta.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.cta[disabled]{opacity:.3;pointer-events:none}
.cta:focus-visible{outline:2px solid var(--coconut);outline-offset:2px}
.big{font-size:28px;font-weight:850;font-stretch:118%;line-height:1.05;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin-top:-6px}
.choice{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 16px;border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--line)}
.choice[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px var(--ink)}
.choice:focus-visible{outline:2px solid var(--coconut)}
.choice b{font-size:16px}
.choice span{color:var(--muted);font-size:13px;text-align:right}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.name{all:unset;cursor:pointer;padding:16px;border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700;font-size:17px}
.name[aria-pressed="true"]{background:var(--ink);color:var(--surface);box-shadow:none}
.name:focus-visible{outline:2px solid var(--coconut)}
.slot{border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:13.5px}
.slot b{color:var(--ink);font-weight:700}
/* rating card */
.photo{position:relative;height:300px;background:var(--line) center/cover no-repeat;flex:none}
.photo .credit{position:absolute;right:8px;bottom:6px;font-size:10px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8);max-width:80%;text-align:right}
.photo .count{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;font-variant-numeric:tabular-nums}
.info{padding:14px 20px 6px;display:flex;flex-direction:column;gap:8px}
.title{font-size:24px;font-weight:850;font-stretch:115%;line-height:1.05}
.facts{color:var(--muted);font-size:13.5px}
.fact-warn{font-size:13.5px}
.fact-warn b{color:var(--skip)}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 20px 18px;margin-top:auto}
.t{all:unset;cursor:pointer;text-align:center;padding:13px 0;border-radius:12px;font-weight:800;font-size:14px;box-shadow:inset 0 0 0 1.5px var(--line)}
.t:focus-visible{outline:2px solid var(--coconut)}
.t.must{background:var(--coconut);color:#1A0E04;box-shadow:none}
.t.keen{background:var(--tea);color:#fff;box-shadow:none}
.t.meh{color:var(--ink)}
.t.skip{color:var(--skip)}
/* compare */
.vs2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:8px;border-radius:16px;overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--line);padding-bottom:12px}
.pick:focus-visible{outline:2px solid var(--coconut)}
.pick .ph{height:150px;background:var(--line) center/cover}
.pick b{padding:0 12px;font-size:15px;line-height:1.15}
.pick span{padding:0 12px;color:var(--muted);font-size:12.5px}
.same{all:unset;cursor:pointer;text-align:center;padding:12px;border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:700}
.same[disabled]{opacity:.35;pointer-events:none}
.same:focus-visible{outline:2px solid var(--coconut)}
/* ranking */
.tierhead{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:15px;padding-top:6px}
.tierhead span{font-weight:500;color:var(--muted);font-size:12.5px}
.level{display:flex;flex-direction:column;border-left:3px solid var(--line);padding-left:10px;gap:6px}
.level.tie{border-left-color:var(--coconut)}
.item{display:grid;grid-template-columns:28px 44px 1fr auto;gap:10px;align-items:center}
.item .rk{font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
.item .th{width:44px;height:44px;border-radius:10px;background:var(--line) center/cover}
.item .nm{font-size:14px;font-weight:600;line-height:1.2}
.mv{display:flex;gap:4px}
.mv button{all:unset;cursor:pointer;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--line);font-size:13px}
.mv button:focus-visible{outline:2px solid var(--coconut)}
/* toast */
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--ink);color:var(--surface);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600}
/* map + plan */
.map{background:var(--sea);border-radius:16px}
.map svg{display:block;width:100%;height:auto}
.day{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.day .d{font-weight:800;color:var(--coconut);font-variant-numeric:tabular-nums}
.day small{display:block;color:var(--muted);font-size:12.5px}
.who{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-weight:600}
.who span{font-size:13px;font-weight:600}
.done{color:var(--tea)} .wait{color:var(--coconut)}
.bar5{display:flex;gap:6px}.bar5 i{flex:1;height:6px;border-radius:99px;background:var(--line)}.bar5 i.on{background:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px}
.chip{font-size:11px;font-weight:700;padding:3px 7px;border-radius:99px;box-shadow:inset 0 0 0 1.2px var(--line)}
.chip.m{background:var(--coconut);color:#1A0E04;box-shadow:none}
.chip.k{background:var(--tea);color:#fff;box-shadow:none}
.row2{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.row2 span:last-child{color:var(--muted);white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.photo,.vs2{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>

<div class="wrap">
  <div class="phone"><div class="screen" id="screen"></div></div>
  <nav class="pager" id="list" aria-label="Screens"></nav>
  <p class="cap" id="side" aria-live="polite"></p>
</div>

<script>
const NAMES=["Brittany","Alex","Antek","Lazza","Saulie"];
const INIT={Brittany:"Br",Alex:"Al",Antek:"An",Lazza:"La",Saulie:"Sa"};
const IMG=k=>`img/${k}.jpg`;
const DECK=[
 {k:"sigiriya",n:"Sigiriya Rock",area:"Cultural Triangle",facts:"Half day · USD 35 · go at 7am",credit:"Dronepicr, CC BY 3.0"},
 {k:"pidurangala",n:"Pidurangala sunrise",area:"Cultural Triangle",facts:"Half day · LKR 1,000 · 5am start",credit:"Nipuna Gamage, CC BY-SA 4.0"},
 {k:"elephants",n:"Elephant safari",area:"Cultural Triangle",facts:"Half day · jeep plus park fee",warn:"December herds are at Kaudulla or Hurulu, not Minneriya",credit:"David Stanley, CC BY 2.0"},
 {k:"polonnaruwa",n:"Polonnaruwa by bike",area:"Cultural Triangle",facts:"Full day · USD 30 · 1 h each way",credit:"Philip Nalangan, CC BY 4.0"},
 {k:"train",n:"Nanu Oya to Ella train",area:"Hill country",facts:"Half day · about LKR 4,000 reserved",warn:"The Kandy section is shut until at least early 2027, so we drive to Nanu Oya first",credit:"Angshuman Chatterjee, CC BY-SA 3.0"},
 {k:"rafting",n:"Kitulgala rafting",area:"Hill country",facts:"Half day · adds a detour",credit:"Pol van den Scheetek, CC BY 3.0"},
 {k:"ellarock",n:"Ella Rock hike",area:"Ella",facts:"Half day · free · leeches in December",credit:"Gayan Perera, CC BY-SA 4.0"},
 {k:"leopard",n:"Yala leopard safari",area:"Wild south",facts:"Half day · about USD 45 plus jeep",credit:"Asirilak, CC BY-SA 4.0"},
 {k:"surf",n:"Weligama surf lesson",area:"South coast",facts:"2 h · beginner bay",credit:"Annelicious i, CC BY-SA 4.0"},
 {k:"galle",n:"Galle Fort and sunset",area:"South coast",facts:"Half day · free",credit:"Jan Kranendonk, CC BY-SA 4.0"}
];
const BY=Object.fromEntries(DECK.map(d=>[d.k,d]));
const TIERS=[["must","Must"],["keen","Keen"],["meh","Meh"],["skip","Skip"]];
const STEPS=[
 ["Pick your name","One link for all five of us. Tap your name, no account or password.","Your opening message sits at the top of this screen."],
 ["How many days","9, 14, flexible or a number of your own. The group plan uses the shortest length anyone picked, and the extras show up at the end.","Flexible counts as 14."],
 ["Pace","How packed the days should be. It changes how much fits per day, not how long anything takes.",""],
 ["Rate, one at a time","Each activity comes up on its own with a photo, a line from a Google review and your comment. Pick Must, Keen, Meh or Skip.","Try it: rate a second activity in the same tier and the next screen kicks in."],
 ["Place it","If a tier already has something in it, you compare the new one against what's there, like Beli. Up to 3 can be tied. A 4th has to go higher or lower.","Only a few comparisons per activity, because it narrows down by halves."],
 ["Re-rank","Once everything is rated, you see your full list and can move things up or down. Tied items share a number.","Example ranking shown if you skipped the rating."],
 ["Suggest something","Anyone can suggest an activity. It waits for you to check it fits the route and season, then everyone rates it.",""],
 ["Your best trip","Your own best route, built from your ranking and your days, with real drive times between stops.","Stops run in geographic order, tried in both directions. Sunrise hikes, morning safaris and the train are pinned to the right time of day."],
 ["Waiting for everyone","The group plan opens when all five are done. Nobody sees it early, so nobody games their votes.",""],
 ["Knockouts","Where two things people want can't both fit, the group gets a Beli-style head-to-head. Five voters, so no ties.","It shows who rated each side, so nobody's Must quietly disappears."],
 ["The plan","The final route, then the practical bits: drive times, what to book and when, full moon days with no alcohol, spare time for rain.",""],
 ["With 14 days","What the group liked that didn't fit in 9, and the route that adds it.",""]
];
let cur=0, me=0, days=9, pace=1, idx=0, pending=null, toastT=null, knock=null;
/* ranking: tier -> array of levels, each level an array of up to 3 keys */
let rank={must:[],keen:[],meh:[],skip:[]};
const MAXTIE=3;
function seedExample(){
  rank={must:[["sigiriya"],["train","leopard"],["rafting"]],keen:[["ellarock","galle","pidurangala"],["surf"]],meh:[["polonnaruwa"]],skip:[]};
  idx=DECK.length; pending=null;
}
function tierOf(k){for(const t in rank)for(const l of rank[t])if(l.includes(k))return t;return null}
function place(k,t){
  const L=rank[t];
  if(!L.length){L.push([k]);return null}
  return {k,t,lo:0,hi:L.length,n:0};
}
function cmpStep(p,ans){
  const L=rank[p.t];const mid=Math.floor((p.lo+p.hi)/2);
  if(ans==="same"){L[mid].push(p.k);return null}
  if(ans==="new")p.hi=mid;else p.lo=mid+1;
  p.n++;
  if(p.lo>=p.hi){L.splice(p.lo,0,[p.k]);return null}
  return p;
}
function rankLabels(){const out={};let n=1;for(const t of["must","keen","meh","skip"])for(const l of rank[t]){for(const k of l)out[k]=l.length>1?n+"=":String(n);n+=l.length}return out}
function move(k,dir){
  const t=tierOf(k);const L=rank[t];const i=L.findIndex(l=>l.includes(k));const lev=L[i];
  if(lev.length>1){lev.splice(lev.indexOf(k),1);L.splice(dir<0?i:i+1,0,[k]);return}
  const j=i+dir;if(j<0||j>=L.length)return;
  L.splice(i,1);const nj=dir<0?j:i;const target=L[nj];
  if(target&&target.length<MAXTIE){target.push(k)}else{L.splice(dir<0?nj:nj+1,0,[k])}
}
function toast(t){const el=document.getElementById("toast");if(!el)return;el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},2200)}

/* map */
const COAST=[[9.83,80.25],[9.66,80.02],[9.38,80.12],[9.0,79.92],[8.6,79.92],[8.23,79.75],[8.03,79.83],[7.58,79.79],[7.2,79.83],[6.93,79.85],[6.58,79.96],[6.42,80.0],[6.2,80.07],[6.03,80.22],[5.94,80.46],[5.92,80.59],[6.02,80.8],[6.12,81.12],[6.22,81.33],[6.4,81.6],[6.84,81.84],[7.2,81.85],[7.72,81.7],[8.15,81.43],[8.57,81.23],[8.95,81.0],[9.27,80.82],[9.6,80.55],[9.83,80.25]];
const STOPS=[["Airport",7.18,79.88],["Sigiriya",7.957,80.76],["Kandy",7.29,80.63],["Nanu Oya",6.94,80.74],["Ella",6.87,81.05],["Tissa",6.28,81.29],["Weligama",5.97,80.43],["Galle",6.03,80.22],["Airport",7.18,79.88]];
const px=(a,o)=>[((o-79.55)*118).toFixed(1),((9.95-a)*118).toFixed(1)];
function mapSVG(){
  const coast=COAST.map(p=>px(p[0],p[1]).join(",")).join(" "),route=STOPS.map(s=>px(s[1],s[2]).join(",")).join(" ");const seen=new Set();
  const dots=STOPS.map(s=>{if(seen.has(s[0]))return"";seen.add(s[0]);const[x,y]=px(s[1],s[2]);const l=["Galle","Airport","Weligama"].includes(s[0]);
    return `<circle cx="${x}" cy="${y}" r="4.5" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><text x="${l?+x-8:+x+8}" y="${+y+4}" text-anchor="${l?"end":"start"}" font-size="11" font-weight="700" font-family="Archivo,sans-serif" fill="var(--ink)">${s[0]}</text>`}).join("");
  return `<svg viewBox="-60 10 340 470" role="img" aria-label="Example route around Sri Lanka"><polygon points="${coast}" fill="var(--land)" stroke="var(--line)" stroke-width="1.5"/><polyline points="${route}" fill="none" stroke="var(--coconut)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`;
}

/* screens */
function sName(){return `<div class="big">Who's this?</div><div class="slot"><b>Brittany's opening message</b><br>You write this once the list is final.</div><div class="names">${NAMES.map((n,i)=>`<button class="name" data-me="${i}" aria-pressed="${i===me}">${n}</button>`).join("")}</div>`}
function sDays(){return `<div class="big">How many days can you do?</div><div class="sub">Landing to take-off</div>${[[9,"9 days",""],[14,"14 days",""],[15,"Flexible","either works"],[11,"My own number","e.g. 11"]].map(o=>`<button class="choice" data-days="${o[0]}" aria-pressed="${days===o[0]}"><b>${o[1]}</b><span>${o[2]}</span></button>`).join("")}`}
function sPace(){return `<div class="big">How packed?</div>${[["Pack it in","early starts, move every 1 to 2 nights"],["Balanced","one big thing a day, some free afternoons"],["Slow","fewer stops, longer in each"]].map((o,i)=>`<button class="choice" data-pace="${i}" aria-pressed="${pace===i}"><b>${o[0]}</b><span>${o[1]}</span></button>`).join("")}`}
function sCompare(p){
  const L=rank[p.t];const mid=Math.floor((p.lo+p.hi)/2);const other=L[mid][0];const a=BY[p.k],b=BY[other];const full=L[mid].length>=MAXTIE;
  return `<div class="big">Which do you want more?</div><div class="sub">Both are ${p.t==="must"?"Musts":TIERS.find(x=>x[0]===p.t)[1]}. Comparison ${p.n+1}</div><div class="vs2">${[["new",a],["old",b]].map(([v,d])=>`<button class="pick" data-cmp="${v}"><div class="ph" style="background-image:url(${IMG(d.k)})"></div><b>${d.n}</b><span>${d.area}</span></button>`).join("")}</div><button class="same" data-cmp="same" ${full?"disabled":""}>${full?"3 already tied there, pick one":"Can't choose, tie them"}</button>`;
}
function sRate(){
  if(pending)return sCompare(pending);
  if(idx>=DECK.length)return `<div class="big">All rated</div><div class="sub">Next you can fine-tune the order</div><button class="cta" data-go="5" style="flex:none">See my ranking</button><button class="cta alt" data-reset="1" style="flex:none">Start the demo again</button>`;
  const d=DECK[idx];
  return `<div class="photo" style="background-image:url(${IMG(d.k)})"><span class="count">${idx+1} of ${DECK.length}</span><span class="credit">Photo: ${d.credit}</span></div><div class="info"><div class="title">${d.n}</div><div class="facts">${d.area} · ${d.facts}</div>${d.warn?`<div class="fact-warn"><b>Heads up:</b> ${d.warn}</div>`:""}<div class="slot"><b>About</b> Google's short description of the place</div><div class="slot"><b>Google review</b> one short line from a review</div><div class="slot"><b>Brittany</b> your take on this one</div></div><div class="tiers">${TIERS.map(t=>`<button class="t ${t[0]}" data-tier="${t[0]}">${t[1]}</button>`).join("")}</div>`;
}
function sPlace(){
  if(pending)return sCompare(pending);
  const ex={k:"galle",t:"keen",lo:0,hi:2,n:0};
  if(!rank.keen.length)rank.keen=[["ellarock","pidurangala","surf"],["polonnaruwa"]];
  return sCompare(ex)+`<div class="slot">Example: Galle Fort just went in as Keen, and 3 Keens are already tied.</div>`;
}
function sRerank(){
  if(!Object.values(rank).some(l=>l.length))seedExample();
  const lab=rankLabels();
  return `<div class="big">Your ranking</div><div class="sub">Move things up or down. Up to 3 can share a spot.</div>`+TIERS.map(([t,T])=>{const L=rank[t];if(!L.length)return"";
    return `<div class="tierhead">${T}<span>${L.reduce((s,l)=>s+l.length,0)}</span></div>`+L.map(l=>`<div class="level${l.length>1?" tie":""}">${l.map(k=>`<div class="item"><span class="rk">${lab[k]}</span><span class="th" style="background-image:url(${IMG(k)})"></span><span class="nm">${BY[k].n}</span><span class="mv"><button data-mv="${k}" data-dir="-1" aria-label="Move ${BY[k].n} up">▲</button><button data-mv="${k}" data-dir="1" aria-label="Move ${BY[k].n} down">▼</button></span></div>`).join("")}</div>`).join("")}).join("");
}
function sSuggest(){return `<div class="big">Something missing?</div><div class="slot" style="min-height:80px">Tea factory tour near Nuwara Eliya</div><button class="cta" style="flex:none">Suggest it</button><div class="row2"><span>Tea factory tour</span><span class="wait">waiting for Brittany</span></div><div class="row2"><span>Hiriketiya beach day</span><span class="done">live, everyone can rate it</span></div>`}
const PLAN=[["1","Land, drive to Sigiriya","about 3.5 h drive"],["2","Sigiriya Rock at 7am, Kaudulla elephants in the afternoon",""],["3","Pidurangala sunrise, drive to Kandy, Temple of the Tooth","about 2.5 h drive"],["4","Drive to Nanu Oya, 14:30 train to Ella","about 3 h drive"],["5","Ella Rock, spare afternoon if it rains",""],["6","Drive to Tissa, Yala safari in the afternoon","about 2 h drive"],["7","Drive to Weligama, surf lesson","about 2 h drive"],["8","Galle Fort and sunset",""],["9","Beach morning, drive to the airport","about 3 h drive"]];
function sMine(){const n=days===15?14:days;return `<div class="big">Your best ${n} days</div><div class="sub">All your Musts fit. Rafting didn't, it goes to the group.</div><div class="map">${mapSVG()}</div>${PLAN.map(r=>`<div class="day"><span class="d">${r[0]}</span><span>${r[1]}${r[2]?`<small>${r[2]}</small>`:""}</span></div>`).join("")}`}
function sWait(){return `<div class="big">4 of 5 done</div><div class="bar5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>${NAMES.map((n,i)=>`<div class="who">${n}<span class="${i===3?"wait":"done"}">${i===3?"still rating":"done"}</span></div>`).join("")}`}
function sKnock(){
  const sides=[["rafting",[["An","m"],["Sa","k"]]],["polonnaruwa",[["Br","k"],["Al","k"],["La","k"]]]];
  return `<div class="big">Knockout 1 of 2</div><div class="sub">Both need day 3. One goes to the 14-day list.</div><div class="vs2">${sides.map(([k,v])=>`<button class="pick" data-knock="${k}" aria-pressed="${knock===k}" style="${knock===k?"box-shadow:inset 0 0 0 3px var(--ink)":""}"><div class="ph" style="background-image:url(${IMG(k)})"></div><b>${BY[k].n}</b><div class="chips">${v.map(x=>`<span class="chip ${x[1]}">${x[0]} ${x[1]==="m"?"Must":"Keen"}</span>`).join("")}</div></button>`).join("")}</div><div class="sub" style="margin-top:0">${knock?"Vote in. Results when all five have voted.":"Tap the one you'd keep."}</div>`;
}
function sPlan(){return `<div class="big">The trip</div><div class="sub">9 days · 7 stops · about 19 h driving</div><div class="map">${mapSVG()}</div><div class="tierhead">Book before you go</div><div class="row2"><span>Nanu Oya to Ella train, day 4</span><span>seats open 30 days ahead</span></div><div class="row2"><span>Yala jeep, day 6</span><span>book with the hotel</span></div><div class="tierhead">Good to know</div><div class="row2"><span>Wet hill country</span><span>day 5 has slack</span></div>`}
function s14(){return `<div class="big">With 14 days you'd also get</div>${[["Kitulgala rafting","Must for Antek"],["Polonnaruwa by bike","Keen for 3"],["Hiriketiya beach days","Keen for 4"],["Horton Plains sunrise","Keen for 2"]].map(r=>`<div class="row2"><span>${r[0]}</span><span>${r[1]}</span></div>`).join("")}<div class="sub" style="margin-top:4px">Adds Kitulgala between Kandy and the hills, and two nights at Hiriketiya before flying home.</div>`}
const SCREENS=[sName,sDays,sPace,sRate,sPlace,sRerank,sSuggest,sMine,sWait,sKnock,sPlan,s14];

const list=document.getElementById("list"),screen=document.getElementById("screen"),side=document.getElementById("side");
function render(){
  list.innerHTML=STEPS.map((s,i)=>`<button class="pg" data-go="${i}" aria-current="${i===cur}" aria-label="${s[0]}" title="${s[0]}">${i+1}</button>`).join("");
  const showFoot=!(cur===3&&!pending&&idx<DECK.length)&&!pending;
  const flush=cur===3&&!pending&&idx<DECK.length;
  screen.innerHTML=`<div class="top"><b>${NAMES[me]}</b><span>${cur+1} / ${STEPS.length}</span></div><div class="body${flush?" flush":""}">${SCREENS[cur]()}</div>${showFoot?`<div class="foot"><button class="cta alt" data-nav="-1" ${cur===0?"disabled":""}>Back</button><button class="cta" data-nav="1" ${cur===STEPS.length-1?"disabled":""}>Next</button></div>`:""}<div class="toast" id="toast" hidden></div>`;
  const s=STEPS[cur];side.innerHTML=`<b>${s[0]}.</b> ${s[2]||s[1]}`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||b.disabled)return;const d=b.dataset;let q=null;
  if(d.go!==undefined){cur=+d.go}
  else if(d.nav){cur=Math.max(0,Math.min(STEPS.length-1,cur+ +d.nav))}
  else if(d.me){me=+d.me;q="Your quip after picking a name"}
  else if(d.days){days=+d.days;q="Your quip for this answer"}
  else if(d.pace){pace=+d.pace;q="Your quip for this answer"}
  else if(d.tier){const k=DECK[idx].k;idx++;pending=place(k,d.tier);q=`Your quip for a ${d.tier}`;if(pending)cur=4}
  else if(d.cmp){pending=cmpStep(pending,d.cmp);if(!pending)cur=3}
  else if(d.mv){move(d.mv,+d.dir)}
  else if(d.knock){knock=d.knock}
  else if(d.reset){rank={must:[],keen:[],meh:[],skip:[]};idx=0;pending=null}
  else return;
  render();if(q)toast(q);
});
render();
</script>
